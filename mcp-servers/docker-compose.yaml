name: dynamic-mcp

x-dynamic-mcp: &dynamic-mcp
  build: .
  image: dynamic-mcp:local
  init: true
  restart: unless-stopped
  environment: &mcp-environment
    MCP_HOST: "0.0.0.0"
    MCP_PORT: "8555"
    LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import socket; socket.create_connection(('127.0.0.1', 8555), timeout=2).close()"
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 60s

services:
  emt-bus-stop:
    <<: *dynamic-mcp
    ports:
      - "${EMT_BUS_STOP_PORT:-8561}:8555"
    environment:
      <<: *mcp-environment
      MCP_SERVER_NAME: "EMT Madrid Parada 72 Cibeles"
      EMT_CLIENT_ID: "${EMT_CLIENT_ID:-}"
      EMT_PASSKEY: "${EMT_PASSKEY:-}"
      EMT_EMAIL: "${EMT_EMAIL:-}"
      EMT_PASSWORD: "${EMT_PASSWORD:-}"
    volumes:
      - ./servers/emt-bus-stop:/app/server:ro

  emt-tickets:
    <<: *dynamic-mcp
    ports:
      - "${EMT_TICKETS_PORT:-8562}:8555"
    environment:
      <<: *mcp-environment
      MCP_SERVER_NAME: "EMT Madrid Billetes (demo)"
    volumes:
      - ./servers/emt-tickets:/app/server:ro

  bicimad:
    <<: *dynamic-mcp
    ports:
      - "${BICIMAD_PORT:-8563}:8555"
    environment:
      <<: *mcp-environment
      MCP_SERVER_NAME: "BiciMAD"
    volumes:
      - ./servers/bicimad:/app/server:ro