[project]
name = "swiss-discover-backend"
version = "0.1.0"
requires-python = ">=3.12,<4"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "aiosqlite>=0.20,<1",
    "pydantic-settings>=2.5,<3",
    "pyjwt[crypto]>=2.9,<3",
    "httpx>=0.27,<1",
    "fastmcp>=2.12,<3",
    "openai>=1.50,<3",
    "jsonschema>=4.20,<5",
    "truststore>=0.10,<1",
    "pyyaml>=6,<7",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "asgi-lifespan>=2,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]