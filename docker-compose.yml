services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swiss_discover
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init/01-keycloak-db.sql:/docker-entrypoint-initdb.d/01-keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swiss_discover && pg_isready -U postgres -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://${PUBLIC_HOST:-localhost}:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      - ./keycloak/themes/swiss-discover:/opt/keycloak/themes/swiss-discover:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r status <&3; [[ \"$$status\" == *' 200 '* ]] "]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    restart: unless-stopped

  zurich-transit:
    build: ./mcp-servers/zurich-transit
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
    ports:
      - "8101:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  museum-guide:
    build: ./mcp-servers/museum-guide
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      MUSEUM_GUIDE_TOKEN: ${MUSEUM_GUIDE_TOKEN:?Set MUSEUM_GUIDE_TOKEN in .env}
    ports:
      - "8102:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-ec", "alembic upgrade head && python -m app.registry.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      APP_NAME: Swiss Discover
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/swiss_discover
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.publicai.co/v1}
      LLM_MODEL: ${LLM_MODEL:-swiss-ai/apertus-v1.5-70b-thinking}
      LLM_API_KEY: ${LLM_API_KEY:-${SWISSCOM_API_KEY:-}}
      PUBLIC_AI_API_KEY: ${PUBLIC_AI_API_KEY:-}
      SWISSCOM_API_KEY: ${SWISSCOM_API_KEY:-}
      LLM_USER_AGENT: ${LLM_USER_AGENT:-SwissDiscover/0.1 (hackathon demo)}
      LLM_IMAGE_INPUT: ${LLM_IMAGE_INPUT:-unknown}
      OIDC_ISSUER: http://${PUBLIC_HOST:-localhost}:8080/realms/swiss-discover
      OIDC_JWKS_URL: http://keycloak:8080/realms/swiss-discover/protocol/openid-connect/certs
      OIDC_AUDIENCE: swiss-discover-api
      CORS_ORIGINS: http://${PUBLIC_HOST:-localhost}:3000,http://localhost:3000
      MCP_ALLOWED_HOSTS: zurich-transit,museum-guide,localhost,127.0.0.1
      REGISTRY_SEED_PATH: /app/seed/registry.yaml
      ZURICH_TRANSIT_URL: ${ZURICH_TRANSIT_URL:-http://zurich-transit:8000/mcp}
      ZURICH_TRANSIT_PUBLIC_URL: ${ZURICH_TRANSIT_PUBLIC_URL:-}
      MUSEUM_GUIDE_URL: ${MUSEUM_GUIDE_URL:-http://museum-guide:8000/mcp}
      MUSEUM_GUIDE_PUBLIC_URL: ${MUSEUM_GUIDE_PUBLIC_URL:-}
      MUSEUM_GUIDE_TOKEN: ${MUSEUM_GUIDE_TOKEN:?Set MUSEUM_GUIDE_TOKEN in .env}
      MAX_TOOL_ROUNDS: "6"
      TOOL_TIMEOUT_S: "20"
      MCP_CONNECT_TIMEOUT_S: "8"
      TOOL_OUTPUT_MAX_CHARS: "8000"
      LLM_TIMEOUT_S: "120"
      MAX_RESPONSE_CHARS: "40000"
      APPROVAL_TIMEOUT_S: "600"
      MAX_UPLOAD_BYTES: "5242880"
      ALLOWED_IMAGE_MIME: image/png,image/jpeg,image/webp,image/gif
      MAX_MESSAGE_CHARS: "8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./seed:/app/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      zurich-transit:
        condition: service_healthy
      museum-guide:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_API_BASE_URL: http://${PUBLIC_HOST:-localhost}:8000
      PUBLIC_OIDC_ISSUER: http://${PUBLIC_HOST:-localhost}:8080/realms/swiss-discover
      PUBLIC_OIDC_CLIENT_ID: swiss-discover-web
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('node:net');const s=net.connect(3000,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));s.setTimeout(3000,()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata: